name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Unit tests
        run: npm run test:all
      - name: Socket end-to-end tests
        run: npm run test:e2e
      - name: Install Chromium for the browser test
        run: npx --prefix client playwright install --with-deps chromium
      - name: Browser test (host + phone play a full tournament)
        run: npm run test:ui
